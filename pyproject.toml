[project]
name = "video-workflow"
version = "0.1.0"
description = "Local single-user video subtitle pipeline with CLI and web controls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "google-genai>=1.0.0",
  "jinja2>=3.1.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
transcription = [
  "faster-whisper>=1.0.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
video-workflow = "video_workflow.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
